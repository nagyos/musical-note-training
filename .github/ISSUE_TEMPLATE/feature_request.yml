name: Feature request
description: New user-facing capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Target phase / release
      options:
        - v1.0 MVP
        - v1.1
        - v1.2
        - v2.0
        - Later
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered